services:
  netscanner:
    # Hazır imaj (GitHub Actions ile yayınlanır): `docker compose pull && docker compose up -d`
    # Yerelde kaynaktan derlemek için: `docker compose up -d --build`
    image: ghcr.io/coraspirin/localnetworkmonitor:latest
    build: .
    container_name: localnetworkmonitor
    # Ev ağını L2 seviyesinde (ARP, mDNS, SSDP, DHCP) görebilmek için host ağı şart.
    # Yalnızca Linux host'ta (Raspberry Pi, NAS, sunucu) tam çalışır.
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    restart: unless-stopped
