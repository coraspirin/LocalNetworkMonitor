<!doctype html>
<html lang="{{ get_lang() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('login.title') }} · Local Network Monitor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="card login-box">
    <div class="page-head" style="margin-bottom:8px">
      <h1>🛰️ {{ t('app.name') }}</h1>
      <span class="lang-switch">
        <a href="/lang/tr?next=/login" class="{{ 'active' if get_lang() == 'tr' }}">TR</a><a href="/lang/en?next=/login" class="{{ 'active' if get_lang() == 'en' }}">EN</a>
      </span>
    </div>
    <p class="muted">{{ t('login.prompt') }}</p>
    {% if error %}<p class="badge sev-high">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="password">{{ t('login.password') }}</label>
        <input id="password" type="password" name="password" autofocus required>
      </div>
      <button class="btn primary" type="submit">{{ t('login.submit') }}</button>
    </form>
  </div>
</body>
</html>
